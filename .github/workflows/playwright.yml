name: Playwright Tests

# Runs the E2E smoke suite against the staging deployment.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#   vars.PLAYWRIGHT_BASE_URL   – staging origin, e.g. https://staging.daywright.com
#   vars.E2E_USER_EMAIL        – optional, defaults to e2e-user-a@daywright.test
#   vars.E2E_USER_B_EMAIL      – optional, defaults to e2e-user-b@daywright.test
#   secrets.E2E_USER_PASSWORD  – REQUIRED for tests. Password matching
#                                 `php artisan db:seed --class=E2eUserSeeder` on staging.
#                                 The job skips gracefully if not configured.
#
# The staging database must already be seeded with:
#   php artisan db:seed --class=E2eUserSeeder
#
# Triggers:
#   - workflow_dispatch: manual run from the Actions tab
#   - push to master: post-merge smoke check against staging
#   - schedule: daily safety net at 06:00 UTC
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

jobs:
  e2e-staging:
    name: E2E smoke tests (staging)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL || 'e2e-user-a@daywright.test' }}
      E2E_USER_B_EMAIL: ${{ vars.E2E_USER_B_EMAIL || 'e2e-user-b@daywright.test' }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Verify staging configuration
        id: check_config
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::warning::PLAYWRIGHT_BASE_URL or E2E_USER_PASSWORD not configured. Skipping staging E2E tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.check_config.outputs.configured == 'true'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.check_config.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.check_config.outputs.configured == 'true'
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        if: steps.check_config.outputs.configured == 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests against staging
        if: steps.check_config.outputs.configured == 'true'
        run: ./node_modules/.bin/playwright test --project=chromium

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.check_config.outputs.configured == 'true' && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
