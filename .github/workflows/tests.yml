name: Laravel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_FOREIGN_KEYS: 'true'
      CI_DB_CONNECTION: sqlite

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, intl, pdo_sqlite
          tools: composer

      - uses: actions/checkout@v5

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies (Verbose)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Dump optimized autoload
        run: composer dump-autoload -o

      - name: Clear caches
        run: php artisan config:clear && php artisan route:clear && php artisan view:clear

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R u+rwX,go-rwx storage bootstrap/cache

      - name: Start Redis Server in GitHub Actions
        uses: supercharge/redis-github-action@bc274cb7238cd63a45029db04ee48c07a72609fd

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: vendor/bin/phpunit

  laravel-tests-mysql:
    name: Laravel tests (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        # Target MySQL 8.4 LTS for the first Cloud / Forge deployment.
        image: mysql:8.4
        env:
          MYSQL_DATABASE: daywright_test
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: daywright_test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: daywright_test
      DB_USERNAME: daywright_test
      DB_PASSWORD: test
      CI_DB_CONNECTION: mysql
      CI_MYSQL_VERSION: '8.4'

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Clear caches
        run: php artisan config:clear && php artisan route:clear && php artisan view:clear

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R u+rwX,go-rwx storage bootstrap/cache

      - name: Start Redis Server in GitHub Actions
        uses: supercharge/redis-github-action@bc274cb7238cd63a45029db04ee48c07a72609fd

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: vendor/bin/phpunit
