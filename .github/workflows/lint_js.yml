name: Javascript linting

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Vue 2 and JS files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run ESLint
      - name: Run ESLint
        run: npx eslint "resources/**/*.{vue,js}" --max-warnings=0

      # Run Stylelint on SCSS files
      - name: Run Stylelint
        run: npm run stylelint

      # Run Prettier check (without modifying files)
      # Temporarily disabled - 93 files need formatting (low priority, will address later)
      # - name: Run Prettier check
      #   run: npx prettier --check "resources/**/*.{vue,js,css,scss,json,md,yml}"

      # Test production build
      - name: Test production build
        run: npm run build

      # Run frontend unit tests
      - name: Run frontend tests
        run: npm test

      # Run NPM security audit
      # Temporarily allowing known vulnerabilities that require breaking changes
      # TODO: Address when upgrading Vue ecosystem
      - name: Run NPM security audit
        run: npm audit --omit=dev || true
