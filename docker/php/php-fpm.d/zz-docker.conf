; ==============================================================================
; DayWright PHP-FPM Pool Override
;
; This file is processed LAST (zz- prefix) and overrides php-fpm defaults.
; The official php:8.3-fpm image ships a "www" pool that listens on a Unix
; socket by default. We switch it to TCP 9000 so Nginx can reach it over the
; Docker internal network via app:9000.
; ==============================================================================

[global]
; Keep PHP-FPM in the foreground so PID 1 stays alive in Docker.
daemonize = no

[www]
; Listen on all interfaces inside the container on port 9000.
; Docker's internal network routes app:9000 → this container.
; Never expose 9000 on the host (compose.production.yaml has no ports: for app).
listen = 0.0.0.0:9000

; Process manager — dynamic, sized to fit safely inside the 512M app container.
; Rule of thumb: 10 workers × ~40 MB RSS ≈ 400 MB (< 512M limit with headroom).
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle workers after this many requests to prevent slow memory leaks.
pm.max_requests = 500

; Pass all host environment variables into the PHP-FPM workers.
; Without this, env() calls in Laravel return null for host env vars.
clear_env = no

; Send PHP-FPM slow-log entries to stderr so Docker captures them.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Log FPM access lines to stdout for Docker log capture.
access.log = /proc/self/fd/2
