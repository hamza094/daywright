# ==============================================================================
# DayWright Production Nginx Configuration
#
# Deployment: direct EC2 (no ALB). Nginx terminates TLS.
# PHP-FPM upstream: 'app:9000' resolved via Docker internal DNS.
# ==============================================================================

# ---------------------------------------------------------------------------
# Port 80 → 443 permanent redirect
# Every plain-HTTP request is immediately redirected to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    server_tokens off;

    # ACME challenge passthrough (Let's Encrypt / certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Local container healthcheck endpoint (avoids 301 -> HTTPS hostname mismatch)
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — primary server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Suppress Nginx version in Server header and error pages
    server_tokens off;

    # Match PHP upload_max_filesize (10M) plus multipart overhead
    client_max_body_size 12M;

    charset utf-8;

    # Docker internal DNS resolver — defers app:9000 resolution to request time
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --------------------------------------------------------------------------
    # TLS certificates
    # Full /etc/letsencrypt directory is mounted read-only at runtime so
    # live/<domain>/* symlinks to ../../archive/<domain>/* resolve across renewals.
    # ${DOMAIN} is substituted at container startup by Nginx's envsubst entrypoint.
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS hardening — TLS 1.2 minimum; TLS 1.3 preferred
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # SECURITY BLOCK 1: Hidden files and directories
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # SECURITY BLOCK 2: Direct PHP execution guard
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        return 403;
    }

    # --------------------------------------------------------------------------
    # SECURITY BLOCK 3: Sensitive file extensions (and Vite sourcemaps)
    # --------------------------------------------------------------------------
    location ~* \.(conf|config|sh|sql|sqlite|htaccess|map)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # /storage and /storage/ — explicit 404
    # S3 handles all uploads; local storage link is unused in production.
    # --------------------------------------------------------------------------
    location = /storage {
        return 404;
        log_not_found off;
    }

    location ^~ /storage/ {
        return 404;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Vite build/ assets — permanent immutable cache (content-hashed filenames)
    # --------------------------------------------------------------------------
    location ~* ^/build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Published vendor / package assets
    # --------------------------------------------------------------------------
    location ~* ^/(vendor|packages)/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Legacy unhashed static assets — short TTL with must-revalidate
    # --------------------------------------------------------------------------
    location ~* \.(css|js|woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Main Laravel request handler
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # PHP-FPM entry point — exact match only
    #
    # Nginx is terminating TLS here directly (no ALB in front), so:
    #   - $https == "on" for all requests that arrive on port 443
    #   - We pass HTTPS=on to PHP-FPM so Laravel's url()->secure() works
    #   - No X-Forwarded-Proto mapping needed (Nginx IS the TLS terminator)
    # --------------------------------------------------------------------------
    location = /index.php {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS           on;
        fastcgi_param HTTP_PROXY      "";

        fastcgi_read_timeout 60;
        fastcgi_send_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --------------------------------------------------------------------------
    # Gzip compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/font-woff2
        application/x-font-ttf;
}
